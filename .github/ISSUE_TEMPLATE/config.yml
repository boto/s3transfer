    url: https://github.com/boto/botocore/issues/new/choose
    about: For put_object, get_object, credentials, signing, retries, or endpoints
  - name: 🔐 Report a security issue
    url: https://github.com/boto/s3transfer/security/policy
    about: Please report vulnerabilities to AWS Security, not as a public issue
